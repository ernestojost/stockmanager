services:
  mysql:
    image: mysql:8.0
    container_name: stockmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockmanager
      MYSQL_USER: stockmanager
      MYSQL_PASSWORD: stockmanager
    ports:
      - "3306:3306"
    volumes:
      - stockmanager-mysql-data:/var/lib/mysql
      # Only run the first time, when the data volume is empty.
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: stockmanager-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: stockmanager
      DB_PASSWORD: stockmanager
      DB_NAME: stockmanager
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: stockmanager-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  stockmanager-mysql-data:
