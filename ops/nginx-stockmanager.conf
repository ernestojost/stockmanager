# nginx vhost for the live demo (https://stockmanager.reddevs.net).
# Installed as /etc/nginx/conf.d/stockmanager.conf on the VPS, next to the
# other apps. Cloudflare proxies the domain; the origin certificate is a
# Let's Encrypt cert issued by acme.sh with the webroot below.
#
#   /var/www/stockmanager.reddevs.net   built SPA (frontend/dist)
#   127.0.0.1:4325                      Express API (pm2: stockmanager-api)

server {
    listen 185.215.167.136:80;
    server_name stockmanager.reddevs.net;

    location /.well-known/acme-challenge/ {
        root /var/www/stockmanager-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 185.215.167.136:443 ssl;
    server_name stockmanager.reddevs.net;

    ssl_certificate /etc/nginx/ssl/stockmanager.reddevs.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stockmanager.reddevs.net/key.pem;

    root /var/www/stockmanager.reddevs.net;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4325;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router): unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
